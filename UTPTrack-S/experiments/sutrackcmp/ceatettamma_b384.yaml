    - 4
    - 4
    - 4
    - 4
    - 4
    - 4
    - 2
    - 2
    - 2
    SAMPLE_PER_EPOCH: 100000
  USE_NLP:
    TNL2K: True
MODEL:
  ENCODER:
    TYPE: ceatettamma_fastitpnb
    STRIDE: 16
    PRETRAIN_TYPE: '/hkfs/home/project/hk-project-p0022189/tum_yvc3016/haowu/SUTrack/pretrained_networks/itpn/fast_itpn_base_clipl_e1600.pt' # 绝对路径用于评测（vot-toolkit）
    PATCHEMBED_INIT: halfcopy
    DROP_PATH: 0.1
    TOKEN_TYPE_INDICATE: True
    # CE & TE
    CE_LOC: [6, 12, 18]
    CE_KEEP_RATIO: [0.7, 0.7, 0.7]
    DTE_LOC: [9, 15, 21]
    DTE_KEEP_RATIO: [ 0.6, 0.6, 0.6]
    STE_LOC: [9, 15, 21]
    STE_KEEP_RATIO: [ 0.6, 0.6, 0.6]
    TOKEN_TYPE_AWARE_PRUNING: 'SOFT_ALL_FOREGROUND'     # 'FULL_FOREGROUND', 'SOFT_ALL_FOREGROUND', 'ALL_FOREGROUND'
    MULTIMODAL_AWARE_PRUNING: True
    MULTIMODAL_AWARE_PRUNING_TARGET: 'S'                # 'C', 'D', 'S', 'C-D', 'C-D-S'
  TEXT_ENCODER:
    TYPE: ViT-L/14
  DECODER:
    TYPE: CENTER
    NUM_CHANNELS: 256
    CONV_TYPE: normal
    XAVIER_INIT: True
  TASK_DECODER:
    NUM_CHANNELS: 256
    FEATURE_TYPE: average
  TASK_NUM: 5
  TASK_INDEX:
    VASTTRACK: 0
    LASOT: 0
    TRACKINGNET: 0
    GOT10K: 0
    COCO: 0
    TNL2K: 1
    DEPTHTRACK: 2
    LASHER: 3
    VISEVENT: 4
TRAIN:
  CE_START_EPOCH: 12    # CE
  CE_WARM_EPOCH: 48     # CE
  TYPE: text_frozen
  ENCODER_MULTIPLIER: 0.1
  BATCH_SIZE: 16
  EPOCH: 180
  GRAD_CLIP_NORM: 0.1
  LR: 0.0001
  LR_DROP_EPOCH: 144
  NUM_WORKER: 16
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  WEIGHT_DECAY: 0.0001
  AMP: False
TEST:
  EPOCH: 180
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 384
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 192
  WINDOW: True
  NUM_TEMPLATES: 2
  UPDATE_INTERVALS:
    DEFAULT: 25
  UPDATE_THRESHOLD:
    DEFAULT: 0.70
  MULTI_MODAL_VISION:
    DEFAULT: True
  MULTI_MODAL_LANGUAGE:
    DEFAULT: True
  USE_NLP:
    DEFAULT: False
    TNL2K: True

